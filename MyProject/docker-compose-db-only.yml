version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: fastapi_react_db
      POSTGRES_USER: fastapi_user
      POSTGRES_PASSWORD: fastapi_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
